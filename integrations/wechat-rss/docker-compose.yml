# 第三方 zlzchat。在仓库根目录执行：
#   docker compose -f integrations/wechat-rss/docker-compose.yml --env-file integrations/wechat-rss/.env up -d
# 源码来自 git submodule third_party/zlzchat，不要把口令写进仓库。
name: zlzchat

services:
  mysql:
    image: mysql:8.0
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gzhweb
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    image: eclipse-temurin:17-jre
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${ZLZCHAT_PORT:-10082}:801"
    environment:
      TZ: Asia/Shanghai
      PROFILES_ACTIVE: pro
      MYSQL_URL: "jdbc:mysql://mysql:3306/gzhweb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8"
      MYSQL_NAME: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      SERVICE_PORT: "801"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_URL: ${SERVER_URL:-http://127.0.0.1:10082}
      API_SERVER: http://111.229.83.152
      PROFILE: /www/wwwroot/zlzchat/uploadPath
    volumes:
      - ../../third_party/zlzchat:/www/wwwroot/zlzchat
    working_dir: /www/wwwroot/zlzchat
    command: ["java", "-Duser.timezone=GMT+08", "-Dfile.encoding=UTF-8", "-Xms512m", "-Xmx1024m", "-jar", "/www/wwwroot/zlzchat/website.jar", "--spring.profiles.active=pro"]
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
